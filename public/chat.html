<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cha0s Chat Overlay</title>
<style id="base-styles">
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Transparent background — required for OBS Browser Source */
  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-start;
    padding: 12px;
    gap: 6px;
  }

  .chat-msg {
    max-width: 94%;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    will-change: transform, opacity;
    animation: msgIn 0.3s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
  }

  .chat-msg.leaving {
    animation: msgOut 0.4s ease forwards;
  }

  @keyframes msgIn  { from { transform: translateX(-16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes msgOut { to   { transform: translateX(-16px); opacity: 0; } }

  /* Right-aligned variant */
  body.pos-right { align-items: flex-end; }
  body.pos-right .chat-msg { animation-name: msgInRight; }
  body.pos-right .chat-msg.leaving { animation-name: msgOutRight; }
  @keyframes msgInRight  { from { transform: translateX(16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes msgOutRight { to   { transform: translateX(16px); opacity: 0; } }

  .chat-badges { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 5px; align-items: center; }
  .chat-badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 1px 5px; border-radius: 4px; vertical-align: middle;
    text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.6;
  }
  .chat-badge.sub          { background: rgba(145, 71, 255, 0.15); color: #9147ff; }
  .chat-badge.mod          { background: rgba(0, 173,  3, 0.15);   color: #00ad03; }
  .chat-badge.vip          { background: rgba(224,  5, 185, 0.15); color: #e005b9; }
  .chat-badge.broadcaster  { background: rgba(255, 68, 68, 0.15);  color: #ff4444; }
  .chat-badge.founder      { background: rgba(170,  64, 213, 0.15);color: #aa40d5; }
  .chat-badge-img { width: 18px; height: 18px; vertical-align: middle; display: inline-block; }
  .chat-source-tag { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.45); vertical-align: middle; margin-right: 4px; text-transform: lowercase; }

  .chat-name { font-weight: 700; margin-right: 3px; }
  .chat-colon { opacity: 0.5; margin-right: 4px; }
  .chat-text  { }
  .chat-ts    { font-size: 10px; color: rgba(255,255,255,0.35); margin-left: 7px; vertical-align: middle; }

  .chat-emote {
    height: 1.8em;
    width: auto;
    vertical-align: middle;
    display: inline-block;
    margin: 0 1px;
    image-rendering: auto;
  }
</style>
<!-- User custom CSS — injected after applyConfig() -->
<style id="custom-styles"></style>
</head>
<body>
<script>
  // ── 7TV emote map (name → cdn url) ───────────────────────────────
  let sevenTvEmotes = {};

  async function loadEmotes() {
    try {
      const r = await fetch('/api/chat/emotes?t=' + Date.now());
      if (r.ok) sevenTvEmotes = await r.json();
    } catch {}
  }

  // ── Defaults ─────────────────────────────────────────────────────
  let CFG = {
    maxMessages:    8,
    lifetime:       30000,
    fontSize:       15,
    bgOpacity:      75,
    bgColor:        '#000000',
    showBadges:     true,
    showTimestamps: false,
    position:       'left',
    customCSS:      '',
  };

  const active = [];

  // ── Helpers ──────────────────────────────────────────────────────
  function hexToRgba(hex, pct) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${(pct / 100).toFixed(2)})`;
  }

  // Deterministic fallback colour when Twitch doesn't send one.
  const FALLBACK_COLOURS = ['#ff6b6b','#ff9f40','#ffd60a','#4ade80','#22d3ee','#818cf8','#e879f9','#fb7185'];
  function nameToColour(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
    return FALLBACK_COLOURS[Math.abs(h) % FALLBACK_COLOURS.length];
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Config application ────────────────────────────────────────────
  function applyConfig() {
    document.body.classList.toggle('pos-right', CFG.position === 'right');

    // Override base-styles for configurable properties
    const dyn = document.getElementById('dyn-styles') || (() => {
      const s = document.createElement('style');
      s.id = 'dyn-styles';
      document.head.appendChild(s);
      return s;
    })();
    dyn.textContent = `
      .chat-msg {
        font-size: ${CFG.fontSize}px;
        background: ${hexToRgba(CFG.bgColor, CFG.bgOpacity)};
      }
    `;

    document.getElementById('custom-styles').textContent = CFG.customCSS || '';
  }

  // ── Emote / fragment rendering ────────────────────────────────────
  function renderFragment(fragment) {
    // Twitch native emote
    if (fragment.type === 'emote' && fragment.emoteId) {
      const url = `https://static-cdn.jtvnw.net/emoticons/v2/${fragment.emoteId}/default/dark/2.0`;
      return `<img class="chat-emote" src="${url}" alt="${esc(fragment.text)}" title="${esc(fragment.text)}">`;
    }
    // Text fragment — scan each word for 7TV emotes
    const words = fragment.text.split(' ');
    return words.map(word => {
      const emoteUrl = sevenTvEmotes[word];
      if (emoteUrl) {
        return `<img class="chat-emote" src="${emoteUrl}" alt="${esc(word)}" title="${esc(word)}">`;
      }
      return esc(word);
    }).join(' ');
  }

  function renderMessageBody(data) {
    if (data.fragments && data.fragments.length > 0) {
      return data.fragments.map(renderFragment).join('');
    }
    // Fallback: plain text + 7TV scan
    return data.message.split(' ').map(word => {
      const emoteUrl = sevenTvEmotes[word];
      if (emoteUrl) {
        return `<img class="chat-emote" src="${emoteUrl}" alt="${esc(word)}" title="${esc(word)}">`;
      }
      return esc(word);
    }).join(' ');
  }

  // ── Message display ───────────────────────────────────────────────
  function addMessage(data) {
    // Evict oldest first if over limit
    while (active.length >= CFG.maxMessages) {
      dismiss(active[0]);
    }

    const el = document.createElement('div');
    el.className = 'chat-msg';

    let html = '';

    // Badges
    if (CFG.showBadges && data.badges?.length) {
      const PILL_MAP = { moderator: 'mod', subscriber: 'sub', vip: 'vip', broadcaster: 'broadcaster', founder: 'founder' };
      const imgs = data.badges.map(b => {
        const key = typeof b === 'string' ? b : `${b.set_id}/${b.id}`;
        const url = badgeCache[key];
        if (url) return `<img class="chat-badge-img" src="${url}" alt="${b.set_id || b}" title="${b.set_id || b}">`;
        const setId = typeof b === 'string' ? b : b.set_id;
        const cls = PILL_MAP[setId];
        return cls ? `<span class="chat-badge ${cls}">${cls === 'broadcaster' ? 'streamer' : cls}</span>` : '';
      }).filter(Boolean);
      if (imgs.length) html += `<span class="chat-badges">${imgs.join('')}</span>`;
    }

    // Shared chat source tag
    if (data.sourceChannel) html += `<span class="chat-source-tag">${esc(data.sourceChannel)}</span>`;

    // Username
    const colour = (data.color && data.color.length === 7) ? data.color : nameToColour(data.user);
    html += `<span class="chat-name" style="color:${colour}">${esc(data.user)}</span>`;
    html += `<span class="chat-colon">:</span>`;
    html += `<span class="chat-text">${renderMessageBody(data)}</span>`;

    // Timestamp
    if (CFG.showTimestamps) {
      const d = new Date();
      const hh = d.getHours().toString().padStart(2, '0');
      const mm = d.getMinutes().toString().padStart(2, '0');
      html += `<span class="chat-ts">${hh}:${mm}</span>`;
    }

    el.innerHTML = html;
    document.body.prepend(el);

    const timer = setTimeout(() => dismiss(entry), CFG.lifetime);
    const entry = { el, timer };
    active.push(entry);
  }

  function dismiss(entry) {
    const idx = active.indexOf(entry);
    if (idx !== -1) active.splice(idx, 1);
    clearTimeout(entry.timer);
    entry.el.classList.add('leaving');
    entry.el.addEventListener('animationend', () => entry.el.remove(), { once: true });
  }

  // ── Config fetch ──────────────────────────────────────────────────
  async function loadConfig() {
    try {
      const r = await fetch('/api/chat/config');
      if (r.ok) {
        const data = await r.json();
        if (data && typeof data === 'object') Object.assign(CFG, data);
      }
    } catch {}
    applyConfig();
  }

  // ── Badge cache ───────────────────────────────────────────────────
  let badgeCache = {};
  function loadBadges() {
    fetch('/api/chat/badges').then(r => r.ok ? r.json() : {}).then(d => { badgeCache = d; }).catch(() => {});
  }
  loadBadges();

  // ── WebSocket connection ──────────────────────────────────────────
  function connect() {
    const ws = new WebSocket('ws://' + location.host);
    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.event === 'chat') addMessage(data);
      if (data.event === 'overlay_config_update' && data.scope === 'chat') loadConfig();
      // Re-fetch emotes once broadcasterId is resolved on the server
      if (data.event === 'seventv_ready') loadEmotes();
      if (data.event === 'init') loadBadges(); // refresh badges after reconnect
    };
    ws.onclose = () => setTimeout(connect, 3000);
    ws.onerror = () => {};
  }

  loadConfig().then(() => {
    loadEmotes();
    connect();
  });
</script>
</body>
</html>
