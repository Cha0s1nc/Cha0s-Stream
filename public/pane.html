<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pane</title>
<style>
  /* Deliberately a separate page rather than index.html hiding 90% of itself:
     index.html is ~3900 lines and its init renders commands, triggers, plugins
     and the queue on every connection, which a dock has no use for. */
  :root {
    --bg:#0f0f11; --surface:#17171a; --surface2:#1f1f23; --border:#2a2a30;
    --accent:#9147ff; --accent-glow:rgba(145,71,255,0.25); --red:#ff4444;
    --text:#e8e8ea; --text2:#a8a8b0; --text3:#6e6e78;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --dur-fast:90ms; --dur-base:150ms;
  }
  html[data-theme="light"] {
    --bg:#f6f6f8; --surface:#fff; --surface2:#eeeef2; --border:#d8d8e0;
    --text:#1a1a1e; --text2:#55555f; --text3:#88889a;
  }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); display:flex; flex-direction:column; }
  .stream-wrap { flex:1; overflow:hidden; display:flex; }
  .cpane-group { display:none; flex:1; overflow:hidden; }
  .cpane-group.active { display:flex; }
  .stream-col { display:flex; flex-direction:column; overflow:hidden; flex:1 1 0; min-width:180px; position:relative; }
  .stream-col-header { display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--border); background:var(--surface); font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; flex-shrink:0; }
  .pane-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pane-actions { display:none; }           /* no close/detach button inside a dock */
  .pane-pin { margin-left:auto; background:none; border:1px solid var(--border); color:var(--text3); cursor:pointer; font-size:11px; line-height:1; padding:3px 7px; border-radius:5px; font-family:var(--font); flex-shrink:0; }
  .pane-pin:hover { border-color:var(--accent); color:var(--text); }
  .pane-pin.active { border-color:var(--accent); color:var(--accent); background:var(--accent-glow); }
  .pane-resize { display:none; }
  .stream-messages { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:3px; }
  .stream-messages::-webkit-scrollbar { width:4px; }
  .stream-messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .empty-state { color:var(--text3); font-size:12px; text-align:center; }
  .chat-msg { font-size:12px; line-height:1.5; word-wrap:break-word; }
  .chat-user { font-weight:600; margin-right:2px; }
  .chat-hl { background:rgba(145,71,255,0.12); border-left:2px solid var(--accent); padding-left:5px; border-radius:3px; }
  .chat-badges { display:inline-flex; gap:3px; vertical-align:middle; margin-right:5px; align-items:center; }
  .chat-badge { font-size:9px; font-weight:700; padding:1px 4px; border-radius:3px; text-transform:uppercase; }
  .chat-badge.sub{background:rgba(145,71,255,.15);color:#9147ff}.chat-badge.mod{background:rgba(0,173,3,.15);color:#00ad03}
  .chat-badge.vip{background:rgba(224,5,185,.15);color:#e005b9}.chat-badge.broadcaster{background:rgba(255,68,68,.15);color:#ff4444}
  .chat-badge.founder{background:rgba(170,64,213,.15);color:#aa40d5}
  .chat-badge-img { width:18px; height:18px; vertical-align:middle; display:inline-block; }
  .chat-source-tag { font-size:9px; color:var(--text3); border:1px solid var(--border); border-radius:3px; padding:0 3px; margin-right:4px; }
  .chat-emote { height:1.4em; vertical-align:middle; }
  .pane-new-pill { position:absolute; left:50%; transform:translateX(-50%); bottom:52px; z-index:3; background:var(--accent); color:#fff; font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; cursor:pointer; }
  .pane-error { font-size:11px; color:var(--red); background:rgba(255,68,68,0.1); border-left:2px solid var(--red); padding:4px 6px; border-radius:4px; }
  .stream-chat-input-wrap { display:flex; gap:6px; padding:6px 8px; border-top:1px solid var(--border); flex-shrink:0; background:var(--surface); align-items:center; }
  .stream-chat-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--text); outline:none; }
  .stream-chat-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
  .stream-chat-send { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .stream-chat-sender-btn { display:none; align-items:center; gap:4px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:5px 8px; font-size:11px; font-weight:600; color:var(--text2); cursor:pointer; flex-shrink:0; white-space:nowrap; }
  .stream-chat-sender-btn.active { display:flex; }
  .pane-obs { flex:1; overflow:hidden; display:flex; flex-direction:column; }
</style>
</head>
<body>
<div class="stream-wrap" id="stream-wrap"></div>
<script src="/chat-render.js"></script>
<script src="/chat-filter.js"></script>
<script src="/chat-pane.js"></script>
<script>
  // Same origin as the dashboard, so the theme choice carries over for free.
  try {
    const t = localStorage.getItem('theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch {}

  // Always-on-top lives on the dock itself, which is where you look for it.
  // Absent outside Electron, so the button only appears when it can work.
  function addPin() {
    const header = document.querySelector('.stream-col-header');
    if (!header || !window.electronAPI?.setPaneAlwaysOnTop || header.querySelector('.pane-pin')) return;
    const q = new URLSearchParams(location.search);
    const pane = { kind: q.get('kind') || 'chat', channel: (q.get('channel') || '').toLowerCase() };
    const btn = document.createElement('button');
    btn.className = 'pane-pin';
    btn.textContent = 'Pin';
    btn.title = 'Keep this window above others';
    btn.addEventListener('click', async () => {
      const r = await window.electronAPI.setPaneAlwaysOnTop(pane, !btn.classList.contains('active'));
      btn.classList.toggle('active', !!r?.alwaysOnTop);
    });
    header.appendChild(btn);
  }
  document.addEventListener('DOMContentLoaded', () => setTimeout(addPin, 300));

  (function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host);
    ws.onmessage = e => {
      let d; try { d = JSON.parse(e.data); } catch { return; }
      if (d.event === 'chat') routeChatToPanes(d);
      else if (d.event === 'init') setPaneBotName(d.botUsername || '');
      else if (d.event === 'oauth_bot_token' && d.username) setPaneBotName(d.username);
    };
    ws.onclose = () => setTimeout(connect, 3000);
  })();
</script>
</body>
</html>
