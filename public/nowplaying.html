<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cha0s Now Playing</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --text: #f5f5f7; --text2: #aeaeb2;
    /* Replaced at runtime by the colour pulled off the cover, unless ?accent=
       pins it. Everything tinted keys off this one variable. */
    --accent: #7c3aed;
    --size: 15px;
    --radius: 14px;
    --width: 440px;
    --art: calc(var(--size) * 4.4);
    --panel: rgba(20, 20, 25, 0.92);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Transparent: OBS composites this over the scene. */
  body {
    background: transparent; overflow: hidden;
    width: 100vw; height: 100vh;
    font-family: var(--font);
    display: flex; padding: 14px;
    -webkit-font-smoothing: antialiased;
  }
  body[data-align="left"]         { justify-content: flex-start; align-items: flex-start; }
  body[data-align="right"]        { justify-content: flex-end;   align-items: flex-start; }
  body[data-align="bottom-left"]  { justify-content: flex-start; align-items: flex-end; }
  body[data-align="bottom-right"] { justify-content: flex-end;   align-items: flex-end; }
  body[data-align="center"]       { justify-content: center;     align-items: center; }

  .np {
    position: relative; overflow: hidden;
    width: var(--width); max-width: 100%; max-height: 100%;
    display: flex; align-items: center; gap: calc(var(--size) * 0.8);
    padding: calc(var(--size) * 0.72);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    will-change: opacity, transform;
  }
  .np.visible { opacity: 1; transform: none; }

  /* Blurred cover behind the card. Sits under everything via a stacking
     context on .np, so it tints the panel without washing out the text. */
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(26px) saturate(1.6) brightness(0.42); transform: scale(1.35);
    opacity: 0; transition: opacity 0.5s ease;
  }
  .np > *:not(.bg) { position: relative; z-index: 1; }

  .art-wrap { position: relative; flex-shrink: 0; }
  .art {
    display: block; width: var(--art); height: var(--art);
    border-radius: calc(var(--size) * 0.55); object-fit: cover;
    background: rgba(255,255,255,0.06);
  }
  /* Nothing to show (OS media keys, Cascade until its payload carries an item
     id) - the accent beats an empty grey square. */
  .art.placeholder { background: linear-gradient(150deg, var(--accent), rgba(255,255,255,0.12)); }

  .meta { min-width: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .title {
    font-size: var(--size); font-weight: 700; letter-spacing: -0.01em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .artist {
    font-size: calc(var(--size) * 0.82); color: var(--text2); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .album {
    font-size: calc(var(--size) * 0.74); color: var(--text2); opacity: 0.75; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .prog { display: flex; align-items: center; gap: 8px; margin-top: calc(var(--size) * 0.42); }
  .bar { position: relative; flex: 1; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.2); overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s linear; }
  .time { font-size: calc(var(--size) * 0.66); color: var(--text2); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .off { display: none !important; }
  .np.paused .title, .np.paused .artist, .np.paused .album { opacity: 0.55; }

  /* ── Themes ─────────────────────────────────────────────────────────────
     Deliberately not skins of one layout: each moves the pieces, because a
     theme that only recolours is a colour setting wearing a hat. */

  /* card - the default. Rounded panel, square art, bar under the text. */
  .np[data-theme="card"] { box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .np[data-theme="card"] .bg { opacity: 0.45; }

  /* minimal - no panel at all, art and text over the scene. Needs its own
     shadow on the text, since there is no background to sit against. */
  .np[data-theme="minimal"] { background: none; padding: 0; box-shadow: none; }
  .np[data-theme="minimal"] .bg { display: none; }
  .np[data-theme="minimal"] .title,
  .np[data-theme="minimal"] .artist,
  .np[data-theme="minimal"] .album { text-shadow: 0 2px 6px rgba(0,0,0,0.85); }
  .np[data-theme="minimal"] .artist { color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: calc(var(--size) * 0.7); }
  .np[data-theme="minimal"] .art { box-shadow: 0 4px 16px rgba(0,0,0,0.6); }

  /* label - a NOW PLAYING plate, a rule, then the text. No art. */
  .np[data-theme="label"] { background: rgba(28, 30, 44, 0.95); gap: 0; }
  .np[data-theme="label"] .art-wrap { display: none; }
  .np[data-theme="label"] .bg { display: none; }
  .np[data-theme="label"]::before {
    content: 'NOW\A PLAYING'; white-space: pre; z-index: 1;
    font-size: calc(var(--size) * 0.62); font-weight: 800; line-height: 1.15;
    letter-spacing: 0.08em; text-align: right; color: var(--text);
    align-self: stretch; display: flex; flex-direction: column; justify-content: center;
    padding-right: calc(var(--size) * 0.8);
    border-right: 2px solid var(--accent);
    margin-right: calc(var(--size) * 0.8);
  }
  .np[data-theme="label"] .title { text-transform: uppercase; font-weight: 800; }
  .np[data-theme="label"] .artist { order: -1; }

  /* vinyl - circular art that turns while playing. */
  .np[data-theme="vinyl"] { border-radius: 999px; padding-right: calc(var(--size) * 1.4); }
  .np[data-theme="vinyl"] .art { border-radius: 50%; animation: spin 6s linear infinite; animation-play-state: paused; }
  .np[data-theme="vinyl"].playing .art { animation-play-state: running; }
  .np[data-theme="vinyl"] .art-wrap::after {
    content: ''; position: absolute; inset: 0; margin: auto;
    width: 22%; height: 22%; border-radius: 50%;
    background: var(--panel); box-shadow: 0 0 0 2px rgba(0,0,0,0.35);
  }
  .np[data-theme="vinyl"] .bg { opacity: 0.5; }
  .np[data-theme="vinyl"] .prog { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* banner - wide, big type, art bled to the left edge. */
  .np[data-theme="banner"] { padding: 0; border-radius: calc(var(--radius) * 0.7); gap: calc(var(--size) * 0.9); }
  .np[data-theme="banner"] .art { width: calc(var(--size) * 5.2); height: calc(var(--size) * 5.2); border-radius: 0; }
  .np[data-theme="banner"] .meta { padding: calc(var(--size) * 0.5) calc(var(--size) * 0.9) calc(var(--size) * 0.5) 0; }
  .np[data-theme="banner"] .title { font-size: calc(var(--size) * 1.25); font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; }
  .np[data-theme="banner"] .bg { opacity: 0.6; }
  .np[data-theme="banner"] .bar-fill { box-shadow: 0 0 10px var(--accent); }

  /* frosted - the cover fills the card behind heavy blur and a scrim. */
  .np[data-theme="frosted"] { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.13); }
  .np[data-theme="frosted"] .bg { opacity: 0.8; filter: blur(30px) saturate(1.7) brightness(0.3); }
  .np[data-theme="frosted"] .art { border-radius: 50%; }
  .np[data-theme="frosted"] .title,
  .np[data-theme="frosted"] .artist,
  .np[data-theme="frosted"] .album { text-shadow: 0 1px 4px rgba(0,0,0,0.75); }
  .np[data-theme="frosted"] .bar { background: rgba(0,0,0,0.35); }

  /* edge - no panel, a full-width accent rule pinned under the text. */
  .np[data-theme="edge"] { background: linear-gradient(90deg, rgba(0,0,0,0.82), rgba(0,0,0,0.35)); border-radius: 0; padding-bottom: calc(var(--size) * 0.9); }
  .np[data-theme="edge"] .bg { opacity: 0.45; }
  .np[data-theme="edge"] .prog { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; gap: 0; }
  .np[data-theme="edge"] .bar { height: 3px; border-radius: 0; background: rgba(255,255,255,0.15); }
  .np[data-theme="edge"] .bar-fill { border-radius: 0; }
  .np[data-theme="edge"] .time { display: none; }
</style>
</head>
<body>
  <div class="np" id="np">
    <div class="bg" id="bg"></div>
    <div class="art-wrap" id="art-wrap"><img class="art" id="art" alt=""></div>
    <div class="meta">
      <div class="title"  id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="album"  id="album"></div>
      <div class="prog" id="prog">
        <span class="time" id="elapsed">0:00</span>
        <div class="bar"><div class="bar-fill" id="fill"></div></div>
        <span class="time" id="remain">0:00</span>
      </div>
    </div>
  </div>

<script>
  // Everything is a query parameter so the overlay stays a plain browser source
  // with no state of its own - copy a URL, paste it into OBS, done.
  //
  //   ?theme=card|minimal|label|vinyl|banner|frosted|edge
  //   ?accent=auto|#ff0055   auto pulls the colour off the cover
  //   ?width=440             card width in px
  //   ?size=15               base type size; everything scales off it
  //   ?radius=14             corner rounding
  //   ?align=left|right|bottom-left|bottom-right|center
  //   ?art=0 ?album=0 ?bar=0 ?times=0     hide individual pieces
  //   ?hide=0                stay on screen when playback stops
  const q = new URLSearchParams(location.search);
  const num = (k, fallback) => { const v = parseFloat(q.get(k)); return v > 0 ? v : fallback; };
  const THEMES = ['card', 'minimal', 'label', 'vinyl', 'banner', 'frosted', 'edge'];

  const theme = THEMES.includes(q.get('theme')) ? q.get('theme') : 'card';
  const accentParam = (q.get('accent') || 'auto').trim();
  const AUTO_ACCENT = accentParam === 'auto' || accentParam === '';
  const SHOW = {
    art:   q.get('art')   !== '0',
    album: q.get('album') !== '0',
    bar:   q.get('bar')   !== '0',
    times: q.get('times') !== '0',
  };
  const HIDE_WHEN_STOPPED = q.get('hide') !== '0';

  const np = document.getElementById('np');
  np.dataset.theme = theme;
  document.body.dataset.align = q.get('align') || 'bottom-left';
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--width',  num('width', 440) + 'px');
  rootStyle.setProperty('--size',   num('size', 15) + 'px');
  rootStyle.setProperty('--radius', (q.get('radius') !== null ? Math.max(0, parseFloat(q.get('radius')) || 0) : 14) + 'px');
  if (!AUTO_ACCENT) rootStyle.setProperty('--accent', accentParam);

  const el = {
    bg: document.getElementById('bg'), art: document.getElementById('art'),
    artWrap: document.getElementById('art-wrap'), title: document.getElementById('title'),
    artist: document.getElementById('artist'), album: document.getElementById('album'),
    prog: document.getElementById('prog'), fill: document.getElementById('fill'),
    elapsed: document.getElementById('elapsed'), remain: document.getElementById('remain'),
  };
  el.artWrap.classList.toggle('off', !SHOW.art);
  el.album.classList.toggle('off', !SHOW.album);
  el.prog.classList.toggle('off', !SHOW.bar);
  el.elapsed.classList.toggle('off', !SHOW.times);
  el.remain.classList.toggle('off', !SHOW.times);

  const mmss = (ms) => {
    if (!Number.isFinite(ms) || ms < 0) ms = 0;
    const t = Math.floor(ms / 1000);
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  };

  /**
   * Pick an accent off the cover.
   *
   * Not an average: averaging washes almost every sleeve toward grey. A pale
   * sky with a red sweater in front of it averages to near-white, and the
   * overlay then falls back to its default colour on artwork that plainly has
   * one. Instead, throw away the pixels that cannot be an accent - near-white,
   * near-black, and the desaturated - bucket what is left by hue, and weight
   * each pixel by its saturation so a vivid area punches above its size
   * without a stray speck winning outright.
   *
   * Artwork is same-origin via /api/art; without that the canvas is tainted
   * and getImageData throws.
   */
  const HUE_BUCKETS = 24;

  function accentFromArt(img) {
    try {
      const N = 32;
      const c = document.createElement('canvas');
      c.width = c.height = N;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, N, N);
      const d = ctx.getImageData(0, 0, N, N).data;

      const buckets = Array.from({ length: HUE_BUCKETS }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
      let considered = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 128) continue;                       // transparent padding
        const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const l = (max + min) / 2, delta = max - min;
        if (l > 0.92 || l < 0.08) continue;                 // paper white, near black
        const sat = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
        if (sat < 0.15) continue;                           // greys carry no hue
        let h;
        if (max === r)      h = ((g - b) / delta + (g < b ? 6 : 0)) / 6;
        else if (max === g) h = ((b - r) / delta + 2) / 6;
        else                h = ((r - g) / delta + 4) / 6;
        const idx = Math.min(HUE_BUCKETS - 1, Math.floor(h * HUE_BUCKETS));
        const bkt = buckets[idx];
        bkt.w += sat; bkt.r += d[i] * sat; bkt.g += d[i + 1] * sat; bkt.b += d[i + 2] * sat;
        considered++;
      }
      // A genuinely monochrome sleeve: inventing a colour would put something on
      // screen that appears nowhere on the cover.
      if (!considered) return null;

      const best = buckets.reduce((a, b) => (b.w > a.w ? b : a));
      if (!best.w) return null;
      const r = best.r / best.w, g = best.g / best.w, b = best.b / best.w;

      const max = Math.max(r, g, b) / 255, min = Math.min(r, g, b) / 255;
      const l = (max + min) / 2, delta = max - min;
      let h = 0;
      if (delta) {
        const rn = r / 255, gn = g / 255, bn = b / 255;
        if (max === rn)      h = ((gn - bn) / delta + (gn < bn ? 6 : 0)) / 6;
        else if (max === gn) h = ((bn - rn) / delta + 2) / 6;
        else                 h = ((rn - gn) / delta + 4) / 6;
      }
      const sat = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
      // Floors, so a muted sleeve still yields something that reads as an accent
      // against the card rather than another shade of grey.
      return `hsl(${Math.round(h * 360)}, ${Math.round(Math.max(0.55, Math.min(1, sat)) * 100)}%, ${Math.round(Math.max(0.52, Math.min(0.68, l)) * 100)}%)`;
    } catch { return null; }
  }

  let track = null;
  let positionAt = 0;

  function render() {
    if (!track) {
      if (HIDE_WHEN_STOPPED) np.classList.remove('visible');
      return;
    }
    np.classList.add('visible');
    np.classList.toggle('paused', !track.isPlaying);
    np.classList.toggle('playing', !!track.isPlaying);
    el.title.textContent = track.title || '';
    el.artist.textContent = track.artist || '';
    el.album.textContent = track.album || '';
    // Nothing to say and nothing to measure against.
    el.prog.classList.toggle('off', !SHOW.bar || !track.durationMs);

    if (track.art) {
      el.art.classList.remove('placeholder');
      el.art.crossOrigin = 'anonymous';
      el.art.src = track.art;
      el.bg.style.backgroundImage = `url("${track.art}")`;
      el.bg.style.opacity = '';
    } else {
      // Clearing src shows a broken-image icon, so remove it outright and let
      // the accent gradient stand in.
      el.art.removeAttribute('src');
      el.art.classList.add('placeholder');
      el.bg.style.backgroundImage = '';
      el.bg.style.opacity = '0';
      if (AUTO_ACCENT) rootStyle.removeProperty('--accent');
    }
  }

  el.art.addEventListener('load', () => {
    if (!AUTO_ACCENT) return;
    const c = accentFromArt(el.art);
    if (c) rootStyle.setProperty('--accent', c);
    else rootStyle.removeProperty('--accent');
  });

  function tick() {
    if (!track?.durationMs) return;
    const base = track.positionMs ?? 0;
    const pos = Math.min(track.durationMs, base + (track.isPlaying ? Date.now() - positionAt : 0));
    el.fill.style.width = (pos / track.durationMs) * 100 + '%';
    el.elapsed.textContent = mmss(pos);
    el.remain.textContent = mmss(track.durationMs - pos);
  }
  setInterval(tick, 250);

  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host);
    ws.onmessage = (e) => {
      let data; try { data = JSON.parse(e.data); } catch { return; }
      if (data.event !== 'now_playing') return;
      // The listener sends the whole payload on every change, so this is a
      // replacement rather than a patch; a null track means nothing is playing.
      track = data.track ? data : null;
      positionAt = Date.now();
      render();
      tick();
    };
    ws.onclose = () => setTimeout(connect, 3000);
    ws.onerror = () => {};
  }
  connect();
</script>
</body>
</html>
