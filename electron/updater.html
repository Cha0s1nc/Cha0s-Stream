<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Available</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #111113;
    --surface: #1c1c1e;
    --surface2:#2c2c2e;
    --border:  #3a3a3c;
    --text:    #f5f5f7;
    --text2:   #aeaeb2;
    --text3:   #6e6e73;
    --accent:  #0a84ff;
    --green:   #32d74b;
    --red:     #ff453a;
    --yellow:  #ffd60a;
    --purple:  #bf5af2;
    --radius:  12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── Header ── */
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .update-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #0a84ff, #bf5af2);
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .header-title { font-size: 18px; font-weight: 700; }
  .header-sub   { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .version-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }

  .ver-block { flex: 1; }
  .ver-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 3px; }
  .ver-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ver-current .ver-value { color: var(--text2); }
  .ver-new .ver-value     { color: var(--green); }

  .ver-arrow { color: var(--text3); font-size: 18px; padding: 0 4px; }

  /* ── Body ── */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text3);
    margin-bottom: 6px;
  }

  /* ── Changelog ── */
  .changelog {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    overflow-y: auto;
    max-height: 180px;
    flex-shrink: 0;
  }

  .changelog h1, .changelog h2, .changelog h3 {
    color: var(--text);
    font-size: 13px;
    margin: 8px 0 4px;
  }
  .changelog h1:first-child,
  .changelog h2:first-child,
  .changelog h3:first-child { margin-top: 0; }

  .changelog ul { padding-left: 18px; margin: 4px 0; }
  .changelog li { margin: 2px 0; }
  .changelog code {
    background: var(--surface2);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .changelog strong { color: var(--text); }
  .changelog p { margin: 4px 0; }

  .changelog-empty { color: var(--text3); font-style: italic; }

  /* ── Progress ── */
  .progress-section { display: none; flex-direction: column; gap: 8px; }
  .progress-section.visible { display: flex; }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }

  /* ── Verbose log ── */
  .log-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 80px;
  }

  .log-header {
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .log-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text3);
    flex-shrink: 0;
  }
  .log-dot.active { background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  #log-output {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--text2);
  }

  .log-line        { color: var(--text2); }
  .log-line.ok     { color: var(--green); }
  .log-line.error  { color: var(--red); }
  .log-line.info   { color: var(--accent); }

  /* ── Footer / actions ── */
  .footer {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .release-link {
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    margin-right: auto;
    cursor: pointer;
  }
  .release-link:hover { text-decoration: underline; }

  .btn {
    border: none;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 20px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn:hover  { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: default; transform: none; }

  .btn-primary   { background: var(--accent); color: #fff; }
  .btn-success   { background: var(--green);  color: #000; }
  .btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }

  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-top">
    <div class="update-icon">🚀</div>
    <div>
      <div class="header-title">Update Available</div>
      <div class="header-sub" id="release-date"></div>
    </div>
  </div>
  <div class="version-row">
    <div class="ver-block ver-current">
      <div class="ver-label">Current</div>
      <div class="ver-value" id="ver-current">—</div>
    </div>
    <div class="ver-arrow">→</div>
    <div class="ver-block ver-new">
      <div class="ver-label">New</div>
      <div class="ver-value" id="ver-new">—</div>
    </div>
  </div>
</div>

<!-- ── Body ── -->
<div class="body">

  <!-- Changelog -->
  <div>
    <div class="section-label">What's New</div>
    <div class="changelog" id="changelog"><span class="changelog-empty">Loading release notes…</span></div>
  </div>

  <!-- Progress (hidden until download starts) -->
  <div class="progress-section" id="progress-section">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-meta">
      <span id="progress-label">0%</span>
      <span id="progress-speed"></span>
    </div>
  </div>

  <!-- Verbose log -->
  <div class="log-wrap">
    <div class="log-header">
      <div class="log-dot" id="log-dot"></div>
      Output
    </div>
    <div id="log-output"></div>
  </div>

</div>

<!-- ── Footer ── -->
<div class="footer">
  <a class="release-link" id="release-link" href="#" style="display:none">View on GitHub ↗</a>
  <button class="btn btn-secondary" id="btn-later">Later</button>
  <button class="btn btn-primary"   id="btn-action">Download Update</button>
</div>

<script>
  /* ── State ── */
  let releaseUrl = '';
  let state = 'idle'; // idle | downloading | done | error

  const elVerCurrent  = document.getElementById('ver-current');
  const elVerNew      = document.getElementById('ver-new');
  const elReleaseDate = document.getElementById('release-date');
  const elChangelog   = document.getElementById('changelog');
  const elProgress    = document.getElementById('progress-section');
  const elFill        = document.getElementById('progress-fill');
  const elPctLabel    = document.getElementById('progress-label');
  const elSpeed       = document.getElementById('progress-speed');
  const elLog         = document.getElementById('log-output');
  const elLogDot      = document.getElementById('log-dot');
  const elReleaseLink = document.getElementById('release-link');
  const btnLater      = document.getElementById('btn-later');
  const btnAction     = document.getElementById('btn-action');

  /* ── Helpers ── */
  function appendLog(text, cls = '') {
    const line = document.createElement('div');
    line.className = 'log-line' + (cls ? ` ${cls}` : '');
    line.textContent = `[${timestamp()}]  ${text}`;
    elLog.appendChild(line);
    elLog.scrollTop = elLog.scrollHeight;
  }

  function timestamp() {
    const n = new Date();
    return n.toTimeString().slice(0, 8);
  }

  function formatBytes(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024)    return (b / 1024).toFixed(0) + ' KB';
    return b + ' B';
  }

  function simpleMarkdown(raw) {
    if (!raw) return '<span class="changelog-empty">No release notes available.</span>';
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const lines = raw.split('\n');
    let html = '';
    let inList = false;

    for (const line of lines) {
      const t = line.trimEnd();
      if (/^### (.+)/.test(t)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h3>${esc(t.replace(/^### /, ''))}</h3>`;
      } else if (/^## (.+)/.test(t)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h2>${esc(t.replace(/^## /, ''))}</h2>`;
      } else if (/^# (.+)/.test(t)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h1>${esc(t.replace(/^# /, ''))}</h1>`;
      } else if (/^[-*] (.+)/.test(t)) {
        if (!inList) { html += '<ul>'; inList = true; }
        const content = t.replace(/^[-*] /, '');
        html += `<li>${inlineFormat(esc(content))}</li>`;
      } else if (t === '') {
        if (inList) { html += '</ul>'; inList = false; }
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<p>${inlineFormat(esc(t))}</p>`;
      }
    }
    if (inList) html += '</ul>';
    return html || '<span class="changelog-empty">No release notes available.</span>';
  }

  function inlineFormat(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }

  /* ── IPC events ── */
  window.updaterAPI.onInit((d) => {
    elVerCurrent.textContent = `v${d.currentVersion}`;
    elVerNew.textContent     = `v${d.newVersion}`;

    if (d.releaseDate) {
      const dt = new Date(d.releaseDate);
      elReleaseDate.textContent = `Released ${dt.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' })}`;
    }

    if (d.releaseUrl) {
      releaseUrl = d.releaseUrl;
      elReleaseLink.style.display = '';
      elReleaseLink.onclick = (e) => { e.preventDefault(); /* opened via shell externally */ };
    }

    elChangelog.innerHTML = simpleMarkdown(d.releaseNotes);
    appendLog(`Update available: v${d.currentVersion} → v${d.newVersion}`, 'info');
  });

  window.updaterAPI.onLog((msg) => {
    appendLog(msg);
  });

  window.updaterAPI.onProgress((d) => {
    if (state !== 'downloading') {
      state = 'downloading';
      elProgress.classList.add('visible');
      elLogDot.classList.add('active');
      btnAction.disabled = true;
      btnAction.innerHTML = '<span class="spinner"></span>Downloading…';
    }

    elFill.style.width = `${d.percent}%`;
    elPctLabel.textContent = `${d.percent}%  (${formatBytes(d.transferred)} / ${formatBytes(d.total)})`;
    elSpeed.textContent = `${(d.bytesPerSecond / 1024 / 1024).toFixed(2)} MB/s`;
    appendLog(d.logLine);
  });

  window.updaterAPI.onDone((d) => {
    state = 'done';
    elFill.style.width = '100%';
    elLogDot.classList.remove('active');
    elPctLabel.textContent = '100%  — Download complete';
    elSpeed.textContent = '';

    appendLog(`v${d.version} downloaded successfully. Ready to install.`, 'ok');

    btnAction.disabled = false;
    btnAction.className = 'btn btn-success';
    btnAction.textContent = '🔄  Restart & Install';
    btnAction.onclick = () => {
      btnAction.disabled = true;
      appendLog('Quitting and installing…', 'info');
      window.updaterAPI.install();
    };
  });

  window.updaterAPI.onError((d) => {
    state = 'error';
    elLogDot.classList.remove('active');
    appendLog(`Error: ${d.message}`, 'error');

    btnAction.disabled = false;
    btnAction.className = 'btn btn-primary';
    btnAction.textContent = 'Retry Download';
    btnAction.onclick = startDownload;
  });

  /* ── Button handlers ── */
  function startDownload() {
    if (state === 'downloading') return;
    appendLog('Starting download…', 'info');
    btnAction.disabled = true;
    btnAction.innerHTML = '<span class="spinner"></span>Downloading…';
    window.updaterAPI.download();
  }

  btnAction.onclick = startDownload;

  btnLater.onclick = () => {
    window.updaterAPI.dismiss();
  };
</script>
</body>
</html>
